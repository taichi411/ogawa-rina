name: One-off Gemini TTS 2026-10-15

on:
  push:
    paths:
      - .github/workflows/tts-oneoff-20261015.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_VOICE: voice_r0oro3zapwtt
          TTS_MODEL: gemini-3.8-flash-tts
          TTS_STYLE: >-
            Bright but calm Japanese female voice. Mostly standard Japanese with only a very subtle Osaka intonation. Friendly and conversational, not announcer-like. Slight pauses around important numbers and conclusions.
          TTS_TEXT: |-
            「老後には2000万円必要」

            <short pause>

            これ、たぶん一回くらい聞いたことありますよね。

            でも実は、
            全員が2000万円用意しないといけない、
            って話ではないんです。

            <short pause>

            この2000万円という数字が話題になったのは、2019年。

            当時の高齢夫婦の無職世帯では、
            毎月の収入より支出のほうが、
            平均で、だいたい5万円多いというデータがありました。

            <short pause>

            じゃあ、その5万円の不足が、
            20年、30年続いたらどうなるか。

            <short pause>

            計算すると、
            だいたい1300万円から2000万円。

            これが、
            いわゆる「老後2000万円問題」です。

            <short pause>

            なので、
            「2000万円貯めなきゃ」
            って、数字だけ覚えるより、

            自分たちは老後、
            毎月いくら使うのか。

            年金などで、
            毎月いくら入ってくるのか。

            その差が、
            何年くらい続くのか。

            <short pause>

            ここを見るほうが大事です。

            老後資金は、
            2000万円から考えるんじゃなくて、

            <short pause>

            自分の、毎月の不足額から考える。

            <short pause>

            まずは、ここからで大丈夫です。
        run: python scripts/gemini_tts.py
      - name: Save generated audio
        uses: actions/upload-artifact@v4
        with:
          name: rina-retirement-2000man
          path: out/gemini-tts/
          if-no-files-found: error
          retention-days: 7

# trigger: 2026-10-15
