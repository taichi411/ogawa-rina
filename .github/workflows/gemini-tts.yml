name: Gemini TTS
run-name: Voice ID lookup (pre-merge test)

on:
  pull_request:
    paths:
      - scripts/gemini_tts.py
      - scripts/test_gemini_tts.py
      - .github/workflows/gemini-tts.yml
  workflow_dispatch:
    inputs:
      text:
        description: 読み上げる台本（タグも入力可）
        required: true
        type: string
        default: こんにちは。音声生成の接続テストです。
      voice:
        description: 声名またはvoice ID（初回はKore）
        required: true
        type: string
        default: Kore
      model:
        description: Gemini TTSモデル
        required: true
        type: string
        default: gemini-3.8-flash-tts
      style:
        description: 演技指示（読み上げ対象には含めない）
        required: false
        type: string
        default: Warm, friendly Japanese; natural conversational pace.

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate without API calls
        run: python -m unittest discover -s scripts -p 'test_gemini_*.py' -v

  list_voices:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: List custom voice IDs (no speech generation)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gemini_voices.py --search ogawa
      - name: Save voice ID list
        uses: actions/upload-artifact@v4
        with:
          name: gemini-voices-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/gemini-voices/
          if-no-files-found: error
          retention-days: 7
