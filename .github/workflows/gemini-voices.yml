name: Gemini Voice IDs

on:
  pull_request:
    paths:
      - scripts/gemini_voices.py
      - scripts/test_gemini_voices.py
      - scripts/gemini_tts.py
      - .github/workflows/gemini-voices.yml
  workflow_dispatch:
    inputs:
      search:
        description: 声名の検索（初回はogawa、空欄なら全カスタム声）
        required: false
        type: string
        default: ogawa

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_gemini_*.py' -v

  list:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: List custom voice IDs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_SEARCH: ${{ inputs.search }}
        run: python scripts/gemini_voices.py
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-voices-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/gemini-voices/
          if-no-files-found: error
          retention-days: 7
